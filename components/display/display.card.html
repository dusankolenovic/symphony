<!-- @dsCard group="Components" viewport="700x340" name="Stat cards & headings" subtitle="Metric cards + two-tone display headings" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style> body { margin:0; padding:32px; background: var(--surface-page); } </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { StatCard, SectionHeading, Eyebrow } = window.Symphony;
const Trend = () => (<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 17l6-6 4 4 8-8M21 7v5M21 7h-5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>);
const Bolt = () => (<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round"/></svg>);
function Demo() {
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:24 }}>
      <div><Eyebrow>Proven impact</Eyebrow><SectionHeading lead="Global" accent="footprint" size="m" style={{marginTop:12}} /></div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
        <StatCard icon={<Trend/>} stat="50%" title="Modernize your data layer" sub="~50% faster implementation" />
        <StatCard icon={<Bolt/>} stat="40-60%" title="Speed up delivery" sub="~40-60% efficiency lift" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
