<!-- @dsCard group="Colors" viewport="700x140" name="Spectrum accents" subtitle="The aurora sweep — blue → magenta → orange" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}
  .row{display:flex;gap:12px}
  .sw{flex:1;height:96px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff}
  .n{font-size:12px;font-weight:700} .h{font-family:var(--font-mono);font-size:10px;opacity:.9}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:#2b4fe8"><span class="n">blue</span><span class="h">#2B4FE8</span></div>
    <div class="sw" style="background:#e0218a"><span class="n">magenta</span><span class="h">#E0218A</span></div>
    <div class="sw" style="background:#ff2e93"><span class="n">pink</span><span class="h">#FF2E93</span></div>
    <div class="sw" style="background:#ff7a18"><span class="n">orange</span><span class="h">#FF7A18</span></div>
    <div class="sw" style="background:#ffb800;color:#3a2600"><span class="n">amber</span><span class="h">#FFB800</span></div>
  </div>
</body></html>
