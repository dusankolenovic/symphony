<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}
  .row{display:flex;gap:12px}
  .sw{flex:1;height:96px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff}
  .n{font-size:12px;font-weight:700} .h{font-family:var(--font-mono);font-size:10px;opacity:.85}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:#9d92ff;color:#1a1730"><span class="n">indigo-300</span><span class="h">#9D92FF</span></div>
    <div class="sw" style="background:#7c6ff6"><span class="n">indigo-400</span><span class="h">#7C6FF6</span></div>
    <div class="sw" style="background:#6d5df6"><span class="n">indigo-500 · primary</span><span class="h">#6D5DF6</span></div>
    <div class="sw" style="background:#5546e8"><span class="n">indigo-600 · hover</span><span class="h">#5546E8</span></div>
    <div class="sw" style="background:#4335c9"><span class="n">indigo-700 · press</span><span class="h">#4335C9</span></div>
  </div>
</body></html>
