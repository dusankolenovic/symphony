<!-- @dsCard group="Type" viewport="700x260" name="Metrics & eyebrows" subtitle="Massive callouts + ALL-CAPS framing labels" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:28px 40px;background:var(--surface-page);font-family:var(--font-body)}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--sym-indigo-300)}
  .eyebrow .tick{width:18px;height:2px;background:currentColor;border-radius:2px}
  .metrics{display:flex;gap:48px;margin-top:24px;flex-wrap:wrap}
  .m .big{font-family:var(--font-display);font-weight:800;font-size:72px;letter-spacing:-.02em;color:#fff;line-height:1}
  .m .tag{font-size:14px;color:var(--text-muted);margin-top:6px;max-width:180px}
  .h{font-family:var(--font-mono);font-size:10px;color:#6b6f86;margin-top:20px;display:block}
</style></head>
<body>
  <span class="eyebrow"><span class="tick"></span>Proven impact</span>
  <div class="metrics">
    <div class="m"><div class="big">$4T</div><div class="tag">AUM across 50+ PE fund partners</div></div>
    <div class="m"><div class="big">40+</div><div class="tag">enterprise product launches</div></div>
    <div class="m"><div class="big">~80%</div><div class="tag">faster delivery cycles</div></div>
  </div>
  <span class="h">Callouts: Poppins 800 · 72px · -0.02em  |  Eyebrow: 600 · 12px · 0.1em caps</span>
</body></html>
