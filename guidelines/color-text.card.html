<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}
  .row{display:flex;gap:24px;align-items:baseline;flex-wrap:wrap}
  .item{display:flex;flex-direction:column;gap:4px}
  .t{font-size:24px;font-weight:700} .h{font-family:var(--font-mono);font-size:10px;color:#6b6f86}
</style></head>
<body>
  <div class="row">
    <div class="item"><span class="t" style="color:#f4f5fb">Strong</span><span class="h">fog-100 #F4F5FB</span></div>
    <div class="item"><span class="t" style="color:#d7d9e6">Body</span><span class="h">fog-200 #D7D9E6</span></div>
    <div class="item"><span class="t" style="color:#a9adc4">Muted</span><span class="h">fog-300 #A9ADC4</span></div>
    <div class="item"><span class="t" style="color:#7f8399">Faint</span><span class="h">fog-400 #7F8399</span></div>
    <div class="item"><span class="t" style="color:#9d92ff">Accent</span><span class="h">indigo-300 #9D92FF</span></div>
  </div>
</body></html>
