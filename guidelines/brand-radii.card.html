<!-- @dsCard group="Brand" viewport="700x180" name="Radii & glass cards" subtitle="Soft rectangles · translucent surfaces" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:24px;background:var(--grad-aurora);background-attachment:fixed;font-family:var(--font-body)}
  .row{display:flex;gap:16px}
  .box{flex:1;height:120px;background:var(--grad-glass);border:1px solid var(--border-default);backdrop-filter:blur(18px);display:flex;align-items:flex-end;padding:12px;color:#fff;box-shadow:var(--shadow-card)}
  .l{font-family:var(--font-mono);font-size:11px}
</style></head>
<body>
  <div class="row">
    <div class="box" style="border-radius:12px"><span class="l">md · 12px</span></div>
    <div class="box" style="border-radius:16px"><span class="l">lg · 16px</span></div>
    <div class="box" style="border-radius:24px"><span class="l">xl · 24px · card</span></div>
    <div class="box" style="border-radius:32px"><span class="l">2xl · 32px · panel</span></div>
  </div>
</body></html>
