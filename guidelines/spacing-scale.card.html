<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:24px 40px;background:var(--surface-page);font-family:var(--font-body)}
  .row{display:flex;align-items:flex-end;gap:14px}
  .item{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--sym-indigo-500);border-radius:4px;width:22px}
  .l{font-family:var(--font-mono);font-size:10px;color:#8b8fa6}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:8px"></div><span class="l">2·8</span></div>
    <div class="item"><div class="bar" style="height:12px"></div><span class="l">3·12</span></div>
    <div class="item"><div class="bar" style="height:16px"></div><span class="l">4·16</span></div>
    <div class="item"><div class="bar" style="height:24px"></div><span class="l">6·24</span></div>
    <div class="item"><div class="bar" style="height:32px"></div><span class="l">8·32</span></div>
    <div class="item"><div class="bar" style="height:48px"></div><span class="l">12·48</span></div>
    <div class="item"><div class="bar" style="height:64px"></div><span class="l">16·64</span></div>
    <div class="item"><div class="bar" style="height:80px"></div><span class="l">20·80</span></div>
  </div>
</body></html>
