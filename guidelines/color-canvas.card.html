<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;background:#101018;font-family:var(--font-body)}
  .row{display:flex;gap:12px}
  .sw{flex:1;height:96px;border-radius:12px;border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#cfd2e2}
  .n{font-size:12px;font-weight:700} .h{font-family:var(--font-mono);font-size:10px;color:#8b8fa6}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:#050509"><span class="n">black</span><span class="h">#050509</span></div>
    <div class="sw" style="background:#08080f"><span class="n">ink-900 · page</span><span class="h">#08080F</span></div>
    <div class="sw" style="background:#0c0c16"><span class="n">ink-800</span><span class="h">#0C0C16</span></div>
    <div class="sw" style="background:#14141f"><span class="n">ink-700 · card</span><span class="h">#14141F</span></div>
    <div class="sw" style="background:#1c1c2b"><span class="n">ink-600 · input</span><span class="h">#1C1C2B</span></div>
    <div class="sw" style="background:#262637"><span class="n">ink-500</span><span class="h">#262637</span></div>
  </div>
</body></html>
