// ── Eyebrow ──
function Eyebrow({ children, tick = true, color = "var(--sym-indigo-300)", style, ...rest }) {
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: "10px", fontFamily: "var(--font-body)", fontWeight: 600, fontSize: "var(--fs-eyebrow)", textTransform: "uppercase", letterSpacing: "var(--ls-eyebrow)", color, ...style }} {...rest}>
      {tick && <span style={{ width: "18px", height: "2px", background: "currentColor", borderRadius: "2px" }} />}
      {children}
    </span>
  );
}

// ── SectionHeading ──
function SectionHeading({ lead, accent, size = "l", as = "h2", style, ...rest }) {
  const Tag = as;
  const sizes = { xl: "var(--fs-display-xl)", l: "var(--fs-display-l)", m: "var(--fs-display-m)", s: "var(--fs-display-s)" };
  return (
    <Tag style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: sizes[size], lineHeight: "var(--lh-tight)", letterSpacing: "var(--ls-display)", color: "var(--text-strong)", margin: 0, ...style }} {...rest}>
      {lead}{lead && accent ? " " : ""}
      {accent && <span style={{ color: "var(--sym-indigo-300)" }}>{accent}</span>}
    </Tag>
  );
}

// ── Button ──
const BTN_RADII = { sm: "var(--radius-md)", md: "var(--radius-lg)", pill: "var(--radius-pill)" };
const BTN_SIZES = { sm: { padding: "10px 18px", fontSize: "0.875rem" }, md: { padding: "14px 26px", fontSize: "1rem" }, lg: { padding: "18px 34px", fontSize: "1.0625rem" } };
function Button({ children, variant = "primary", size = "md", arrow = false, shape = "md", disabled = false, onClick, style, ...rest }) {
  const base = { display: "inline-flex", alignItems: "center", gap: "10px", fontFamily: "var(--font-body)", fontWeight: 700, lineHeight: 1, borderRadius: BTN_RADII[shape] || BTN_RADII.md, border: "1px solid transparent", cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.45 : 1, transition: "background var(--dur-fast) var(--ease-std), transform var(--dur-fast) var(--ease-std)", whiteSpace: "nowrap", ...BTN_SIZES[size] };
  const variants = {
    primary: { background: "var(--grad-primary)", color: "#fff", boxShadow: "var(--glow-indigo)" },
    secondary: { background: "var(--surface-glass)", color: "var(--text-strong)", borderColor: "var(--border-default)", backdropFilter: "blur(var(--blur-glass))" },
    ghost: { background: "transparent", color: "var(--text-strong)" },
    outline: { background: "transparent", color: "var(--text-strong)", borderColor: "var(--border-strong)" },
  };
  return (
    <button type="button" disabled={disabled} onClick={onClick} style={{ ...base, ...variants[variant], ...style }}
      onMouseDown={(e) => !disabled && (e.currentTarget.style.transform = "scale(0.97)")}
      onMouseUp={(e) => (e.currentTarget.style.transform = "scale(1)")}
      onMouseLeave={(e) => (e.currentTarget.style.transform = "scale(1)")}
      {...rest}>
      {children}
      {arrow && <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" /></svg>}
    </button>
  );
}

// ── Badge ──
function Badge({ children, tone = "stat", style, ...rest }) {
  const base = { display: "inline-flex", alignItems: "center", gap: "6px", borderRadius: "var(--radius-pill)", fontFamily: "var(--font-body)", fontWeight: 700, fontSize: "0.75rem", lineHeight: 1, padding: "6px 12px", whiteSpace: "nowrap" };
  const tones = {
    new: { background: "var(--sym-indigo-500)", color: "#fff", textTransform: "uppercase", letterSpacing: "0.06em" },
    stat: { background: "var(--surface-glass)", color: "var(--text-strong)", border: "1px solid var(--border-subtle)", fontFamily: "var(--font-mono)" },
    outline: { background: "transparent", color: "var(--text-muted)", border: "1px solid var(--border-default)" },
  };
  return <span style={{ ...base, ...tones[tone], ...style }} {...rest}>{children}</span>;
}

// ── Tag ──
function Tag({ children, variant = "solid", style, ...rest }) {
  const base = { display: "inline-flex", alignItems: "center", borderRadius: "var(--radius-pill)", fontFamily: "var(--font-body)", fontWeight: 700, fontSize: "0.9375rem", lineHeight: 1, padding: "12px 24px", whiteSpace: "nowrap" };
  const variants = { solid: { background: "var(--sym-indigo-500)", color: "#fff" }, outline: { background: "transparent", color: "var(--text-strong)", border: "1px solid var(--border-strong)" } };
  return <span style={{ ...base, ...variants[variant], ...style }} {...rest}>{children}</span>;
}

// ── Card ──
function Card({ children, variant = "solid", padding = "var(--space-8)", style, ...rest }) {
  const base = { borderRadius: "var(--radius-xl)", padding, position: "relative" };
  const variants = {
    solid: { background: "var(--surface-card)", border: "1px solid var(--border-subtle)" },
    glass: { background: "var(--grad-glass)", border: "1px solid var(--border-default)", backdropFilter: "blur(var(--blur-glass))", WebkitBackdropFilter: "blur(var(--blur-glass))", boxShadow: "var(--shadow-card)" },
    outline: { background: "transparent", border: "1px solid var(--border-default)" },
  };
  return <div style={{ ...base, ...variants[variant], ...style }} {...rest}>{children}</div>;
}

// ── StatCard ──
function StatCard({ icon, stat, title, sub, style, ...rest }) {
  return (
    <div style={{ background: "var(--surface-card)", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-xl)", padding: "var(--space-6)", display: "flex", flexDirection: "column", gap: "var(--space-8)", minHeight: "220px", ...style }} {...rest}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div style={{ width: "56px", height: "56px", borderRadius: "var(--radius-md)", background: "var(--surface-glass)", border: "1px solid var(--border-subtle)", display: "grid", placeItems: "center", color: "var(--text-strong)" }}>{icon}</div>
        {stat && <span style={{ fontFamily: "var(--font-mono)", fontSize: "0.8125rem", fontWeight: 700, color: "var(--text-strong)", background: "var(--surface-glass)", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-pill)", padding: "6px 12px" }}>{stat}</span>}
      </div>
      <div style={{ marginTop: "auto" }}>
        <h3 style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: "1.5rem", color: "var(--text-strong)", letterSpacing: "-0.01em", lineHeight: 1.1 }}>{title}</h3>
        {sub && <p style={{ marginTop: "10px", color: "var(--text-muted)", fontSize: "1rem" }}>{sub}</p>}
      </div>
    </div>
  );
}

// ── Input ──
function Input({ label, style, wrapStyle, ...rest }) {
  const [focused, setFocused] = React.useState(false);
  return (
    <label style={{ display: "block", ...wrapStyle }}>
      {label && <span style={{ display: "block", fontSize: "0.8125rem", fontWeight: 600, color: "var(--text-muted)", marginBottom: "8px" }}>{label}</span>}
      <input onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
        style={{ width: "100%", fontFamily: "var(--font-body)", fontSize: "1rem", color: "var(--text-strong)", background: "var(--surface-input)", border: `1px solid ${focused ? "var(--border-accent)" : "var(--border-subtle)"}`, borderRadius: "var(--radius-md)", padding: "16px 18px", outline: "none", boxShadow: focused ? "0 0 0 3px rgba(109,93,246,0.18)" : "none", transition: "border-color var(--dur-fast) var(--ease-std), box-shadow var(--dur-fast) var(--ease-std)", ...style }} {...rest} />
    </label>
  );
}

// ── Textarea ──
function TextareaField({ label, rows = 5, style, wrapStyle, ...rest }) {
  const [focused, setFocused] = React.useState(false);
  return (
    <label style={{ display: "block", ...wrapStyle }}>
      {label && <span style={{ display: "block", fontSize: "0.8125rem", fontWeight: 600, color: "var(--text-muted)", marginBottom: "8px" }}>{label}</span>}
      <textarea rows={rows} onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
        style={{ width: "100%", resize: "vertical", fontFamily: "var(--font-body)", fontSize: "1rem", lineHeight: "var(--lh-normal)", color: "var(--text-strong)", background: "var(--surface-input)", border: `1px solid ${focused ? "var(--border-accent)" : "var(--border-subtle)"}`, borderRadius: "var(--radius-md)", padding: "16px 18px", outline: "none", boxShadow: focused ? "0 0 0 3px rgba(109,93,246,0.18)" : "none", transition: "border-color var(--dur-fast) var(--ease-std), box-shadow var(--dur-fast) var(--ease-std)", ...style }} {...rest} />
    </label>
  );
}

// ── AnnouncementBar ──
function AnnouncementBar({ title, subtitle, badge = "New", cta = "Read the case study", onCta, onClose, style, ...rest }) {
  const ctlStyle = { width: "40px", height: "40px", display: "grid", placeItems: "center", background: "var(--surface-glass)", border: "1px solid var(--border-default)", borderRadius: "var(--radius-md)", color: "#fff", cursor: "pointer" };
  return (
    <div style={{ position: "relative", display: "flex", alignItems: "center", justifyContent: "space-between", gap: "var(--space-8)", padding: "18px var(--gutter)", background: "linear-gradient(90deg, rgba(85,70,232,0.5) 0%, rgba(43,25,90,0.55) 55%, rgba(224,33,138,0.35) 100%), var(--sym-ink-800)", borderBottom: "1px solid var(--border-subtle)", ...style }} {...rest}>
      <div style={{ minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: "10px", flexWrap: "wrap" }}>
          <span style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: "1.375rem", color: "#fff", letterSpacing: "-0.01em" }}>{title}</span>
          {badge && <span style={{ background: "var(--sym-indigo-500)", color: "#fff", fontSize: "0.6875rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em", borderRadius: "var(--radius-pill)", padding: "4px 10px" }}>{badge}</span>}
        </div>
        {subtitle && <p style={{ marginTop: "4px", color: "var(--text-body)", fontSize: "0.9375rem" }}>{subtitle}</p>}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: "10px", flexShrink: 0 }}>
        <button type="button" onClick={onCta} style={{ display: "inline-flex", alignItems: "center", gap: "10px", background: "var(--grad-primary)", color: "#fff", fontFamily: "var(--font-body)", fontWeight: 700, fontSize: "1rem", border: "none", borderRadius: "var(--radius-lg)", padding: "14px 24px", cursor: "pointer", boxShadow: "var(--glow-indigo)", whiteSpace: "nowrap" }}>
          {cta}
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" /></svg>
        </button>
        <button type="button" aria-label="Minimize" style={ctlStyle}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 12h12" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" /></svg>
        </button>
        <button type="button" aria-label="Close" onClick={onClose} style={ctlStyle}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" /></svg>
        </button>
      </div>
    </div>
  );
}

// ── NavBar ──
function NavBar({ items, active, onSelect, style, ...rest }) {
  const list = items || [
    { label: "Who we are" },
    { label: "What we do", caret: true },
    { label: "Business segments", caret: true },
    { label: "Industries", caret: true },
    { label: "Insights and results", caret: true },
    { label: "Let's work together" },
    { label: "Careers", caret: true },
  ];
  return (
    <nav style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "var(--space-8)", height: "var(--nav-height)", padding: "0 var(--gutter)", ...style }} {...rest}>
      <Wordmark height={24} />
      <div style={{ display: "flex", alignItems: "center", gap: "6px", flexWrap: "wrap" }}>
        {list.map((it) => {
          const on = active === it.label;
          return (
